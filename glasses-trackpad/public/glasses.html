<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Glasses Assistant</title>
<style>
  :root {
    --hud-glow: #4dd2ff;
    --bg: #0d1117;
    --panel: #161b22;
    --border: #30363d;
    --text: #e6edf3;
    --muted: #8b949e;
    --green: #3fb950;
    --red: #f85149;
    --amber: #d29922;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    background: radial-gradient(ellipse at center, #10161f 0%, #05080c 75%);
    font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    color: var(--text);
  }

  #statusbar {
    font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--muted); display: flex; align-items: center; gap: 8px;
  }
  #statusbar .dot {
    width: 9px; height: 9px; border-radius: 50%;
    background: var(--red); box-shadow: 0 0 6px var(--red);
  }
  #statusbar.connected .dot { background: var(--green); box-shadow: 0 0 6px var(--green); }

  #hud {
    position: relative;
    width: 480px; height: 400px;
    border-radius: 28px;
    border: 2px solid rgba(77, 210, 255, 0.55);
    box-shadow: 0 0 24px rgba(77, 210, 255, 0.35), inset 0 0 32px rgba(77, 210, 255, 0.08);
    overflow: hidden;
    background: var(--bg);
  }

  #card { position: absolute; inset: 0; display: flex; flex-direction: column; padding: 18px 22px; }

  .head {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted);
    margin-bottom: 8px;
  }
  .chip {
    border: 1px solid var(--border); border-radius: 14px;
    padding: 3px 12px; font-size: 11.5px; letter-spacing: 0.05em;
  }
  .chip.add  { color: var(--green); border-color: rgba(63,185,80,0.5); }
  .chip.mult { color: var(--amber); border-color: rgba(210,153,34,0.5); }
  .chip.task { color: var(--hud-glow); border-color: rgba(77,210,255,0.5); }

  .body { flex: 1; overflow: hidden; display: flex; flex-direction: column; }
  .scrollable { flex: 1; overflow: hidden; }

  /* home prompt list */
  .prompt {
    display: flex; align-items: center; gap: 9px;
    border: 1px solid var(--border); border-radius: 16px;
    background: #171e28;
    padding: 6px 13px; margin: 3px 0;
    font-size: 13px; cursor: pointer;
  }
  .prompt .mic { color: var(--hud-glow); font-size: 11px; }
  .prompt.soon { color: var(--muted); }
  .prompt.soon .mic { color: var(--border); }

  .pillrow { display: flex; justify-content: center; gap: 14px; padding-top: 8px; }
  .pill {
    border-radius: 22px; border: 1px solid var(--border);
    background: #21262d; color: var(--text);
    font-size: 14px; padding: 9px 22px; cursor: pointer;
  }
  .pill.small { font-size: 12px; padding: 6px 14px; }
  .pill.good { border-color: rgba(63,185,80,0.6); color: var(--green); }
  .pill.bad  { border-color: rgba(248,81,73,0.6); color: var(--red); }

  .bigq { font-size: 34px; font-weight: 600; text-align: center; }
  .biganswer {
    font-size: 42px; font-weight: 700; text-align: center;
    color: var(--hud-glow); text-shadow: 0 0 16px rgba(77,210,255,0.5); min-height: 50px;
  }
  .biganswer.hidden { visibility: hidden; }
  .hint { font-size: 11.5px; color: var(--muted); text-align: center; }
  .center { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; }

  /* cooking */
  .ing {
    display: flex; align-items: center; gap: 10px;
    border: 1px solid var(--border); border-radius: 14px;
    padding: 6px 12px; margin: 3px 0; font-size: 13.5px; cursor: pointer;
    background: #171e28;
  }
  .ing .box {
    width: 16px; height: 16px; border-radius: 4px;
    border: 1.5px solid var(--muted); flex: none;
    display: flex; align-items: center; justify-content: center; font-size: 12px;
  }
  .ing.checked { border-color: rgba(63,185,80,0.5); }
  .ing.checked .box { border-color: var(--green); color: var(--green); }
  .steptext { font-size: 23px; font-weight: 600; text-align: center; line-height: 1.35; }
  .timerchip {
    font-size: 26px; font-weight: 700; color: var(--amber);
    border: 1px solid rgba(210,153,34,0.5); border-radius: 14px; padding: 4px 18px;
  }
  .timerchip.running { color: var(--hud-glow); border-color: rgba(77,210,255,0.5); }

  /* ideation */
  .idea-title { font-size: 26px; font-weight: 700; text-align: center; }
  .idea-tag { font-size: 14px; color: var(--muted); text-align: center; }
  .tags { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }
  .tags .chip { font-size: 10.5px; padding: 2px 9px; }
  .details { font-size: 12.5px; color: var(--text); margin: 4px 0 0; padding-left: 18px; }
  .details li { margin: 2px 0; }
  .shortlist { font-size: 15px; line-height: 1.7; text-align: center; }
  .score-line { font-size: 20px; text-align: center; }
  .score-line .g { color: var(--green); }
  .score-line .m { color: var(--red); }
  .score-line .s { color: var(--amber); }

  /* translate task */
  .camera {
    border: 1.5px dashed rgba(139,148,158,0.5);
    border-radius: 12px;
    padding: 10px 14px;
    margin: 2px 0 6px;
  }
  .camera .camlabel {
    font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--muted); margin-bottom: 6px;
  }
  .tline {
    padding: 5px 10px; margin: 3px 0;
    border-radius: 10px; border: 1px solid transparent;
    font-size: 14.5px; cursor: pointer;
  }
  .tline:hover { border-color: var(--border); }
  .tline .es {
    display: block;
    color: var(--hud-glow);
    font-size: 13.5px;
    margin-top: 1px;
  }
  .tasknote { font-size: 12.5px; color: var(--muted); margin: 2px 0 4px; }
  .elnote {
    font-size: 12px;
    color: var(--hud-glow);
    padding: 2px 14px 5px;
    line-height: 1.4;
  }

  /* piano task */
  .piano {
    position: relative;
    height: 128px;
    margin: 6px 2px;
    display: flex;
  }
  .wkey {
    flex: 1;
    background: #e9edf2;
    border: 1px solid #0d1117;
    border-radius: 0 0 6px 6px;
    position: relative;
    cursor: pointer;
  }
  .wkey .kname {
    position: absolute; bottom: 4px; left: 0; right: 0;
    text-align: center; font-size: 10px; color: #30363d;
  }
  .bkey {
    position: absolute;
    top: 0; width: 9%; height: 58%;
    background: #10141a;
    border: 1px solid #000;
    border-radius: 0 0 4px 4px;
    z-index: 2;
    cursor: pointer;
  }
  .wkey.target, .bkey.target {
    box-shadow: inset 0 0 0 2px var(--hud-glow), 0 0 10px rgba(77,210,255,0.5);
  }
  .wkey.hitkey { background: #bdf1d0; }
  .bkey.hitkey { background: #1f5c38; }
  .wkey.pressed, .bkey.pressed { transform: translateY(2px); filter: brightness(1.2); }

  /* AI corrective-edit styles */
  .ai-emphasize {
    font-size: 1.25em !important;
    color: var(--hud-glow) !important;
    text-shadow: 0 0 12px rgba(77, 210, 255, 0.6);
  }
  .ai-dim { opacity: 0.35; }
  .ai-strike { text-decoration: line-through; opacity: 0.6; }

  [data-action].hud-hover {
    outline: 2px solid var(--hud-glow);
    outline-offset: -2px;
    background: rgba(77, 210, 255, 0.12) !important;
  }
  [data-action].circled {
    outline: 2px solid var(--amber);
    outline-offset: -2px;
    background: rgba(210, 153, 34, 0.15) !important;
  }

  #ink {
    position: absolute; inset: 0;
    pointer-events: none;
    z-index: 15;
    transition: opacity 0.6s;
  }
  #ink.fade { opacity: 0; }

  #cursor {
    position: absolute; width: 26px; height: 26px; border-radius: 50%;
    border: 2px solid var(--hud-glow); background: rgba(77, 210, 255, 0.18);
    box-shadow: 0 0 12px rgba(77, 210, 255, 0.6);
    transform: translate(-50%, -50%);
    pointer-events: none; z-index: 20; transition: opacity 0.3s;
  }
  #cursor::after { content: ''; position: absolute; inset: 9px; border-radius: 50%; background: var(--hud-glow); }
  #cursor.hidden { opacity: 0; }
  #cursor.pen { border-radius: 4px; }
  #cursor.pen::after { border-radius: 2px; }

  .ripple {
    position: absolute; border-radius: 50%;
    border: 2px solid var(--hud-glow);
    transform: translate(-50%, -50%);
    pointer-events: none; z-index: 19;
    animation: ripple 0.45s ease-out forwards;
  }
  @keyframes ripple {
    from { width: 10px; height: 10px; opacity: 1; }
    to   { width: 90px; height: 90px; opacity: 0; }
  }

  #flash {
    position: absolute; inset: 0; pointer-events: none; opacity: 0; z-index: 18;
  }
  #flash.right { background: linear-gradient(90deg, transparent 40%, rgba(63,185,80,0.25)); }
  #flash.left  { background: linear-gradient(270deg, transparent 40%, rgba(248,81,73,0.25)); }
  #flash.show { animation: flash 0.4s ease-out; }
  @keyframes flash { from { opacity: 1; } to { opacity: 0; } }

  #toast {
    position: absolute; left: 50%; bottom: 14px;
    transform: translateX(-50%) translateY(20px);
    background: rgba(13, 17, 23, 0.92);
    border: 1px solid var(--hud-glow); color: var(--hud-glow);
    padding: 7px 16px; border-radius: 18px; font-size: 13px;
    opacity: 0; transition: opacity 0.25s, transform 0.25s;
    z-index: 30; pointer-events: none;
    white-space: nowrap; max-width: 440px; overflow: hidden; text-overflow: ellipsis;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* Claude's interpretation of a drawing */
  #bubble {
    position: absolute;
    left: 50%; top: 14px;
    transform: translateX(-50%) translateY(-16px);
    background: rgba(13, 17, 23, 0.95);
    border: 1px solid var(--amber);
    color: var(--text);
    padding: 9px 16px;
    border-radius: 14px;
    font-size: 13px;
    line-height: 1.4;
    max-width: 420px;
    text-align: center;
    opacity: 0;
    transition: opacity 0.3s, transform 0.3s;
    z-index: 31;
    pointer-events: none;
  }
  #bubble.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  #bubble .who { color: var(--amber); font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase; display: block; margin-bottom: 2px; }
  #bubble.thinking { border-color: var(--border); color: var(--muted); }
</style>
</head>
<body>

<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

<div id="statusbar"><span class="dot"></span><span id="statustext">waiting for trackpad…</span></div>

<div id="hud">
  <div id="card"></div>
  <canvas id="ink" width="480" height="400"></canvas>
  <div id="flash"></div>
  <div id="cursor" class="hidden"></div>
  <div id="toast"></div>
  <div id="bubble"></div>
</div>

<script>
(function () {
  const W = 480, H = 400;
  const hud = document.getElementById('hud');
  const card = document.getElementById('card');
  const ink = document.getElementById('ink');
  const inkCtx = ink.getContext('2d');
  const cursor = document.getElementById('cursor');
  const toast = document.getElementById('toast');
  const bubble = document.getElementById('bubble');
  const flash = document.getElementById('flash');
  const statusbar = document.getElementById('statusbar');
  const statustext = document.getElementById('statustext');

  let cx = W / 2, cy = H / 2;
  let hovered = null;
  let toastTimer = null;
  let ws = null;

  const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');

  // ====================== prompt catalog ======================
  const PROMPTS = [
    { id: 'quiz',      text: 'Quiz me on addition and multiplication', ready: true },
    { id: 'cook',      text: 'Help me cook pasta carbonara',           ready: true },
    { id: 'ideate',    text: 'Help me brainstorm hackathon project ideas', ready: true },
    { id: 'translate', text: 'Translate what I’m looking at to Spanish', ready: true },
    { id: 'piano',     text: 'Teach me basic piano', ready: true },
  ];

  // ====================== app state ======================
  let screen = 'home';     // home | quiz | cook | ideate | soon
  let soonPrompt = null;   // which unbuilt prompt was opened

  // --- quiz state ---
  const qz = {};
  function quizReset() {
    const qs = [];
    const ri = (lo, hi) => lo + Math.floor(Math.random() * (hi - lo + 1));
    for (let i = 0; i < 10; i++) {
      const a = ri(10, 99), b = ri(10, 99);
      qs.push({ topic: 'Addition', cls: 'add', text: a + ' + ' + b + ' = ?', answer: a + b });
    }
    for (let i = 0; i < 10; i++) {
      const a = ri(2, 12), b = ri(2, 12);
      qs.push({ topic: 'Multiplication', cls: 'mult', text: a + ' × ' + b + ' = ?', answer: a * b });
    }
    for (let i = qs.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [qs[i], qs[j]] = [qs[j], qs[i]];
    }
    Object.assign(qz, { queue: qs, pos: 0, revealed: false, finished: false, got: 0, missed: 0, skipped: 0 });
  }

  // --- cooking state ---
  const INGREDIENTS = ['Spaghetti (400 g)', 'Eggs (4 yolks)', 'Pecorino Romano (80 g)',
                       'Guanciale or bacon (150 g)', 'Black pepper', 'Salt'];
  const STEPS = [
    { text: 'Bring a large pot of salted water to a boil' },
    { text: 'Cook the spaghetti until al dente', timer: 10 },
    { text: 'Meanwhile: crisp the guanciale in a dry pan', timer: 5 },
    { text: 'Whisk egg yolks with pecorino and lots of black pepper' },
    { text: 'Drain pasta — keep a cup of the starchy water!' },
    { text: 'Off the heat: toss pasta with guanciale, then fold in the egg mix' },
    { text: 'Loosen with pasta water until silky. Plate + more cheese' },
  ];
  const ck = {};
  function cookReset() {
    Object.assign(ck, { phase: 'ingredients', checked: INGREDIENTS.map(() => false), step: 0,
                        timer: null, remaining: 0, timersDone: 0 });
  }
  function stopTimer() {
    if (ck.timer) { clearInterval(ck.timer); ck.timer = null; }
  }

  // --- ideation state ---
  const IDEAS = [
    { title: 'GestureChef', tag: 'Hands-free recipe navigation on smart glasses', tags: ['wearables', 'CV'],
      details: ['Steps pinned in your view while you cook', 'Flick wrist to advance, circle an ingredient to substitute', 'Judges love a live demo you can taste'] },
    { title: 'SignBridge', tag: 'Real-time sign-language captions for meetings', tags: ['accessibility', 'ML'],
      details: ['Webcam → pose model → captions in the call', 'Start with 50 common signs', 'Huge accessibility impact story'] },
    { title: 'StudyLens', tag: 'Point at a textbook page, get flashcards', tags: ['education', 'OCR'],
      details: ['OCR + LLM generates spaced-repetition cards', 'Quiz mode on the glasses display', 'Pairs with the trackpad prototype!'] },
    { title: 'CrowdSync', tag: 'Find your friends at a festival with AR arrows', tags: ['AR', 'geo'],
      details: ['Offline-first mesh of phone locations', 'Arrow overlay + haptic hot/cold', 'Works when cell networks are jammed'] },
    { title: 'EcoCart', tag: 'Scan groceries, see carbon footprint instantly', tags: ['climate', 'CV'],
      details: ['Barcode → footprint database lookup', 'Weekly report + swap suggestions', 'Easy to demo with real products'] },
    { title: 'NapMap', tag: 'Crowd-sourced quiet spots on campus', tags: ['social', 'sensors'],
      details: ['Phones sample ambient noise (opt-in)', 'Heatmap of nap-worthy spots', 'Silly, memorable, actually useful'] },
    { title: 'PitchCoach', tag: 'AR teleprompter that scores your delivery', tags: ['AR', 'speech'],
      details: ['Script scrolls in your glasses', 'Live pace/filler-word feedback', 'Demo: pitch the judges with it on'] },
    { title: 'MemLane', tag: 'Whisper-quiet name reminders at networking events', tags: ['wearables', 'privacy'],
      details: ['Face match against people you’ve met (on-device)', 'Name + context appears in HUD', 'Big privacy discussion built in'] },
  ];
  const INTAKE = [
    { q: 'What type of project?', opts: ['Mobile app', 'Hardware / wearable', 'Web app', 'AI tool'] },
    { q: 'Who is it for?', opts: ['Students', 'Everyday consumers', 'Accessibility', 'Climate & community'] },
    { q: 'What vibe are you going for?', opts: ['Practical & useful', 'Silly & memorable', 'Technically impressive', 'Social impact'] },
  ];
  const id8 = {};
  function ideateReset() {
    Object.assign(id8, {
      phase: 'intake', qi: 0, answers: [], ideas: null,
      pos: 0, expanded: false, kept: [], dropped: [], finished: false,
    });
  }

  // --- translate state: scenes the glasses are "looking at" ---
  const SCENES = [
    { name: 'Café menu', lines: [
      { en: 'Grilled cheese sandwich', es: 'Sándwich de queso a la plancha' },
      { en: 'Tomato soup', es: 'Sopa de tomate' },
      { en: 'Iced coffee', es: 'Café helado' },
      { en: 'Fresh orange juice', es: 'Jugo de naranja natural' },
    ] },
    { name: 'Street sign', lines: [
      { en: 'Main Street', es: 'Calle Principal' },
      { en: 'No parking Mon–Fri', es: 'Prohibido estacionar de lunes a viernes' },
      { en: 'Bus stop ahead', es: 'Parada de autobús más adelante' },
    ] },
    { name: 'Museum label', lines: [
      { en: 'Please do not touch', es: 'Por favor, no tocar' },
      { en: 'Oil on canvas, 1887', es: 'Óleo sobre lienzo, 1887' },
      { en: 'Gift of the artist', es: 'Donación del artista' },
    ] },
  ];
  const tr = {};
  function translateReset() {
    Object.assign(tr, { scene: 0, revealed: SCENES[0].lines.map(() => false), photoImage: null, photoLines: null });
  }
  function translateScene(delta) {
    tr.scene = (tr.scene + delta + SCENES.length) % SCENES.length;
    tr.revealed = SCENES[tr.scene].lines.map(() => false);
  }

  // --- piano state ---
  const WHITE_KEYS = ['C', 'D', 'E', 'F', 'G', 'A', 'B'];
  const BLACK_KEYS = [
    { n: 'Db', left: 10 }, { n: 'Eb', left: 24.3 },
    { n: 'Gb', left: 53 }, { n: 'Ab', left: 67.3 }, { n: 'Bb', left: 81.6 },
  ];
  const NOTE_FREQ = {
    C: 261.63, Db: 277.18, D: 293.66, Eb: 311.13, E: 329.63, F: 349.23,
    Gb: 369.99, G: 392.0, Ab: 415.3, A: 440.0, Bb: 466.16, B: 493.88,
  };
  const LESSONS = [
    { title: 'Find middle C', text: 'C sits just left of the two black keys. Tap it.', target: ['C'] },
    { title: 'C major chord', text: 'C – E – G makes a C major chord. Tap all three.', target: ['C', 'E', 'G'] },
    { title: 'F major chord', text: 'Now F – A – C. Notice the same shape, moved up.', target: ['F', 'A', 'C'] },
    { title: 'G major chord', text: 'And G – B – D — the third chord of the family.', target: ['G', 'B', 'D'] },
    { title: 'First progression', text: 'C, then F, then G — tap them in order. That’s the backbone of a thousand songs.', target: ['C', 'F', 'G'], ordered: true },
  ];
  const pn = {};
  function pianoReset() {
    Object.assign(pn, { lesson: 0, hits: [], finished: false });
  }

  let audioCtx = null;
  function playNote(name) {
    try {
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = 'triangle';
      o.frequency.value = NOTE_FREQ[name] || 261.63;
      g.gain.setValueAtTime(0.25, audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.6);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(); o.stop(audioCtx.currentTime + 0.65);
    } catch {}
  }

  quizReset(); cookReset(); ideateReset(); translateReset(); pianoReset();

  // ====================== rendering ======================
  function homeBtn() {
    return '<button class="pill small" data-action="Home" data-cmd="home">⌂ Home</button>';
  }

  function render() {
    stopTimerIfLeftCook();
    if (screen === 'home') renderHome();
    else if (screen === 'quiz') renderQuiz();
    else if (screen === 'cook') renderCook();
    else if (screen === 'ideate') renderIdeate();
    else if (screen === 'translate') renderTranslate();
    else if (screen === 'piano') renderPiano();
    else renderSoon();
    updateHover();
  }

  function stopTimerIfLeftCook() {
    if (screen !== 'cook') stopTimer();
  }

  function renderHome() {
    const rows = PROMPTS.map((p) =>
      '<div class="prompt' + (p.ready ? '' : ' soon') + '" data-action="' + esc(p.text) + '"' +
      ' data-cmd="open:' + p.id + '"><span class="mic">●</span>' + esc(p.text) +
      (p.ready ? '' : ' <span style="margin-left:auto;font-size:10px;color:var(--border);">soon</span>') +
      '</div>').join('');
    card.innerHTML =
      '<div class="head"><span>ASSISTANT · what do you want to do?</span><span class="chip task">' + PROMPTS.length + ' prompts</span></div>' +
      '<div class="scrollable" id="scrollable">' + rows + '</div>' +
      '<div class="hint" style="padding-top:6px;">tap a prompt · or circle one in draw mode</div>';
  }

  function renderQuiz() {
    if (qz.finished) {
      card.innerHTML =
        '<div class="head"><span>QUIZ · done</span><span class="chip">Results</span></div>' +
        '<div class="center">' +
          '<div class="score-line"><span class="g">' + qz.got + ' got it</span> · ' +
          '<span class="m">' + qz.missed + ' missed</span> · ' +
          '<span class="s">' + qz.skipped + ' skipped</span></div>' +
        '</div>' +
        '<div class="pillrow"><button class="pill" data-action="Restart quiz" data-cmd="quiz:restart">Restart</button>' + homeBtn() + '</div>';
      return;
    }
    const q = qz.queue[qz.pos];
    const btns = qz.revealed
      ? '<button class="pill good" data-action="Got it" data-cmd="quiz:got">Got it</button>' +
        '<button class="pill bad" data-action="Missed it" data-cmd="quiz:miss">Missed it</button>'

  // ====================== commands ======================
  function run(cmd) {
    if (!cmd) return false;
    const [ns, verb, arg] = cmd.split(':');

    if (ns === 'home') { screen = 'home'; render(); return true; }

    if (ns === 'open') {
      const p = PROMPTS.find(x => x.id === verb);
      if (!p) return false;
      if (!p.ready) { soonPrompt = p.text; screen = 'soon'; }
      else {
        screen = p.id;
        if (p.id === 'quiz') quizReset();
        if (p.id === 'cook') cookReset();
        if (p.id === 'ideate') ideateReset();
        if (p.id === 'translate') translateReset();
        if (p.id === 'piano') pianoReset();
      }
      render();
      return true;
    }

    if (ns === 'quiz') {
      if (verb === 'only') {
        quizReset();
        const topic = arg === 'addition' ? 'Addition' : 'Multiplication';
        qz.queue = qz.queue.filter((q) => q.topic === topic);
        screen = 'quiz';
        render();
        return true;
      }
      if (verb === 'mixed') { quizReset(); screen = 'quiz'; render(); return true; }
      if (verb === 'restart') quizReset();
      else if (qz.finished) return false;
      else if (verb === 'reveal') qz.revealed = true;
      else if (verb === 'skip') { qz.skipped++; quizAdvance(); }
      else if (verb === 'got') { qz.got++; quizAdvance(); }
      else if (verb === 'miss') { qz.missed++; qz.queue.push(qz.queue[qz.pos]); quizAdvance(); }
      render();
      return true;
    }

    if (ns === 'cook') {
      if (verb === 'restart') cookReset();
      else if (verb === 'ing') { const i = +arg; ck.checked[i] = !ck.checked[i]; }
      else if (verb === 'start') ck.phase = 'steps';
      else if (verb === 'next') {
        stopTimer();
        if (ck.step >= STEPS.length - 1) ck.phase = 'done';
        else ck.step++;
      }
      else if (verb === 'back') { stopTimer(); if (ck.step > 0) ck.step--; }
      else if (verb === 'timer') {
        const s = STEPS[ck.step];
        if (!s.timer || ck.timer) return false;
        ck.remaining = s.timer;
        ck.timer = setInterval(() => {
          ck.remaining--;
          if (ck.remaining <= 0) {
            stopTimer();
            ck.timersDone++;
            showToast('⏰ Timer done — ' + s.text);
            sendAck('Timer done', true);
          }
          if (screen === 'cook') render();
        }, 1000);
      }
      render();
      return true;
    }

    if (ns === 'tr') {
      if (verb === 'line') {
        const i = +arg;
        if (!SCENES[tr.scene].lines[i]) return false;
        tr.revealed[i] = !tr.revealed[i];
      } else if (verb === 'all') {
        const show = !tr.revealed.every(Boolean);
        tr.revealed = tr.revealed.map(() => show);
      } else if (verb === 'scenes') { tr.photoImage = null; tr.photoLines = null; }
      else if (verb === 'next') translateScene(1);
      else if (verb === 'prev') translateScene(-1);
      else return false;
      render();
      return true;
    }

    if (ns === 'piano') {
      if (verb === 'restart') { pianoReset(); render(); return true; }
      if (verb === 'next') {
        if (pn.lesson >= LESSONS.length - 1) pn.finished = true;
        else { pn.lesson++; pn.hits = []; }
        render();
        return true;
      }
      if (verb === 'back') {
        if (pn.finished) pn.finished = false;
        else if (pn.lesson > 0) pn.lesson--;
        pn.hits = [];
        render();
        return true;
      }
      if (verb === 'key') {
        if (pn.finished || !NOTE_FREQ[arg]) return false;
        playNote(arg);
        const ls = LESSONS[pn.lesson];
        if (ls.ordered) {
          if (arg === ls.target[pn.hits.length]) pn.hits.push(arg);
          else pn.hits = (arg === ls.target[0]) ? [arg] : [];
        } else if (ls.target.includes(arg) && !pn.hits.includes(arg)) {
          pn.hits.push(arg);
        }
        const complete = ls.target.every((n) => pn.hits.includes(n)) &&
          (!ls.ordered || pn.hits.length === ls.target.length);
        render();
        if (complete) {
          showToast('✓ ' + ls.title + '!');
          sendAck(ls.title + ' complete', true);
          const atLesson = pn.lesson;
          setTimeout(() => {
            if (screen === 'piano' && !pn.finished && pn.lesson === atLesson) {
              if (pn.lesson >= LESSONS.length - 1) pn.finished = true;
              else { pn.lesson++; pn.hits = []; }
              render();
            }
          }, 1100);
        }
        return true;
      }
      return false;
    }

    if (ns === 'ideate') {
      if (verb === 'restart') { ideateReset(); render(); return true; }
      if (verb === 'opt') {
        if (id8.phase !== 'intake') return false;
        const Q = INTAKE[id8.qi];
        const a = Q && Q.opts[+arg];
        if (!a) return false;
        id8.answers.push({ q: Q.q, a });
        id8.qi++;
        if (id8.qi >= INTAKE.length) {
          id8.phase = 'loading';
          render();
          requestIdeas();
        } else {
          render();
        }
        return true;
      }
      if (id8.phase !== 'cards' || id8.finished) return false;
      if (verb === 'details') id8.expanded = !id8.expanded;
      else if (verb === 'keep') { id8.kept.push(id8.pos); ideateAdvance(); }
      else if (verb === 'drop') { id8.dropped.push(id8.pos); ideateAdvance(); }
      else return false;
      render();
      return true;
    }
    return false;
  }

  function requestIdeas() {
    if (ws && ws.readyState === WebSocket.OPEN) {
      pending = { ideas: true, closed: false, hits: [] };
      clearTimeout(pendingTimer);
      pendingTimer = setTimeout(() => localInterpret(), 25000);
      showBubble('brainstorming…', true);
      ws.send(JSON.stringify({
        type: 'interpret',
        payload: { screen: 'ideate', task: 'generate-ideas', answers: id8.answers },
      }));
    } else {
      useStaticIdeas('no server connection — built-in ideas');
    }
  }

  function useStaticIdeas(reason) {
    id8.ideas = null;
    id8.phase = 'cards';
    id8.pos = 0;
    if (screen === 'ideate') render();
    if (reason) showToast(reason);
  }

  function quizAdvance() {
    qz.revealed = false;
    qz.pos++;
    if (qz.pos >= qz.queue.length) qz.finished = true;
  }
  function ideateAdvance() {
    id8.expanded = false;
    id8.pos++;
    if (id8.pos >= (id8.ideas || IDEAS).length) id8.finished = true;
  }

  // swipe → per-screen command
  function swipeCmd(dir) {
    if (screen === 'quiz' && !qz.finished) return dir === 'right' ? ['quiz:got', 'Got it'] : ['quiz:miss', 'Missed it — will come back'];
    if (screen === 'cook' && ck.phase === 'steps') return dir === 'right' ? ['cook:next', 'Next step'] : ['cook:back', 'Previous step'];
    if (screen === 'ideate' && id8.phase === 'cards' && !id8.finished) return dir === 'right' ? ['ideate:keep', 'Shortlisted ⭐'] : ['ideate:drop', 'Discarded'];
    if (screen === 'translate') return dir === 'right' ? ['tr:next', 'Next scene'] : ['tr:prev', 'Previous scene'];
    if (screen === 'piano' && !pn.finished) return dir === 'right' ? ['piano:next', 'Next lesson'] : ['piano:back', 'Previous lesson'];
    return null;
  }

  // ====================== WS + input ======================
  function connect() {
    ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host);
    ws.onopen = () => ws.send(JSON.stringify({ type: 'hello', role: 'display' }));
    ws.onclose = () => { setStatus(false, 'server disconnected — retrying…'); setTimeout(connect, 1500); };
    ws.onmessage = (ev) => {
      let msg;
      try { msg = JSON.parse(ev.data); } catch { return; }
      handle(msg);
    };
  }
  function setStatus(ok, text) {
    statusbar.classList.toggle('connected', ok);
    statustext.textContent = text;
  }
  function sendAck(action, hit) {
    if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type: 'ack', action, hit }));
  }

  function handle(msg) {
    switch (msg.type) {
      case 'status': {
        const n = msg.trackpads | 0;
        setStatus(n > 0, n > 0 ? 'trackpad connected (' + n + ')' : 'waiting for trackpad…');
        cursor.classList.toggle('hidden', n === 0);
        break;
      }
      case 'move':
        cx = Math.max(0, Math.min(W, cx + (+msg.dx || 0)));
        cy = Math.max(0, Math.min(H, cy + (+msg.dy || 0)));
        renderCursor();
        break;
      case 'tap': doTap(); break;
      case 'swipe': doSwipe(msg.dir); break;
      case 'scroll': doScroll(+msg.dy || 0); break;
      case 'draw': doDraw(msg); break;
      case 'photo': doPhoto(msg); break;
      case 'assistant': onAssistant(msg); break;
      case 'mode':
        cursor.classList.toggle('pen', msg.mode === 'draw');
        drawIntent = msg.intent === 'correct' ? 'correct' : 'interact';
        showToast(msg.mode === 'draw'
          ? (drawIntent === 'correct' ? '\u{1F527} draw · corrective' : '✋ draw · interactive')
          : '○ cursor mode');
        break;
    }
  }

  function renderCursor() {
    cursor.style.left = cx + 'px';
    cursor.style.top = cy + 'px';
    updateHover();
  }
  function elementUnderCursor() {
    const rect = hud.getBoundingClientRect();
    cursor.style.display = 'none';
    const el = document.elementFromPoint(rect.left + cx, rect.top + cy);
    cursor.style.display = '';
    return el ? el.closest('[data-action]') : null;
  }
  function updateHover() {
    const el = elementUnderCursor();
    if (el !== hovered) {
      if (hovered && hovered.isConnected) hovered.classList.remove('hud-hover');
      hovered = el;
      if (hovered) hovered.classList.add('hud-hover');
    }
  }

  function doTap() {
    const r = document.createElement('div');
    r.className = 'ripple';
    r.style.left = cx + 'px';
    r.style.top = cy + 'px';
    hud.appendChild(r);
    r.addEventListener('animationend', () => r.remove());

    const el = elementUnderCursor();
    if (el && run(el.dataset.cmd)) {
      showToast(el.dataset.action);
      sendAck(el.dataset.action, true);
    } else {
      showToast('nothing selectable');
      sendAck('nothing selectable', false);
    }
  }

  function doSwipe(dir) {
    flash.className = dir === 'right' ? 'right show' : 'left show';
    setTimeout(() => { flash.className = ''; }, 450);
    // a pending AI proposal captures the flick as yes/no
    if (proposal) {
      const p = proposal;
      proposal = null;
      clearTimeout(proposalTimer);
      if (dir === 'right') {
        applyAssistant(p.actions, p.edits);
        showBubble('✓ done');
        sendAck('Confirmed — done', true);
      } else {
        hideBubble();
        showToast('okay, cancelled');
        sendAck('Cancelled', false);
      }
      return;
    }
    const sc = swipeCmd(dir);
    if (sc && run(sc[0])) {
      showToast(sc[1]);
      sendAck(sc[1], true);
    } else {
      sendAck('swipe does nothing here', false);
    }
  }

  function doScroll(dy) {
    const el = document.getElementById('scrollable');
    if (el) { el.scrollTop += dy; updateHover(); }
  }

  // ====================== drawing / circling ======================
  // A "drawing" is one or more strokes made in quick succession (so an X,
  // an arrow, or a question mark reads as one gesture). Interpretation
  // fires after a short pause in drawing.
  const STROKE_IDLE_MS = 900;
  let strokes = [];   // completed strokes of the current drawing
  let stroke = [];    // stroke in progress
  let fadeTimer = null;
  let strokeIdleTimer = null;

  function drawStrokes() {
    inkCtx.clearRect(0, 0, W, H);
    inkCtx.strokeStyle = 'rgba(77, 210, 255, 0.9)';
    inkCtx.lineWidth = 3;
    inkCtx.lineCap = 'round';
    inkCtx.lineJoin = 'round';
    inkCtx.shadowColor = 'rgba(77, 210, 255, 0.8)';
    inkCtx.shadowBlur = 8;
    for (const s of [...strokes, stroke]) {
      if (s.length < 2) continue;
      inkCtx.beginPath();
      inkCtx.moveTo(s[0].x, s[0].y);
      for (let i = 1; i < s.length; i++) inkCtx.lineTo(s[i].x, s[i].y);
      inkCtx.stroke();
    }
  }

  function clearInk(withFade) {
    clearTimeout(fadeTimer);
    clearTimeout(strokeIdleTimer);
    if (withFade) {
      ink.classList.add('fade');
      fadeTimer = setTimeout(() => {
        strokes = []; stroke = [];
        inkCtx.clearRect(0, 0, W, H);
        ink.classList.remove('fade');
      }, 650);
    } else {
      strokes = []; stroke = [];
      inkCtx.clearRect(0, 0, W, H);
      ink.classList.remove('fade');
    }
  }

  // The pen is relative, like the cursor: a stroke starts wherever the
  // cursor currently is and finger deltas drag it, leaving ink. (Absolute
  // x/y coordinates are still accepted for older trackpad pages.)
  let penX = 0, penY = 0;
  function doDraw(msg) {
    if (msg.phase === 'clear') { clearInk(false); return; }
    if (msg.phase === 'start') {
      // a fading drawing was already interpreted - don't let its strokes
      // rejoin the new drawing
      if (ink.classList.contains('fade')) clearInk(false);
      clearTimeout(fadeTimer);
      clearTimeout(strokeIdleTimer); // another stroke joins this drawing
      ink.classList.remove('fade');
      penX = (typeof msg.x === 'number') ? Math.max(0, Math.min(W, msg.x * W)) : cx;
      penY = (typeof msg.y === 'number') ? Math.max(0, Math.min(H, msg.y * H)) : cy;
      stroke = [{ x: penX, y: penY }];
      drawStrokes();
    } else if (msg.phase === 'move') {
      if (typeof msg.dx === 'number') {
        penX = Math.max(0, Math.min(W, penX + msg.dx));
        penY = Math.max(0, Math.min(H, penY + (+msg.dy || 0)));
      } else {
        penX = Math.max(0, Math.min(W, (+msg.x || 0) * W));
        penY = Math.max(0, Math.min(H, (+msg.y || 0) * H));
      }
      stroke.push({ x: penX, y: penY });
      cx = penX; cy = penY; // the cursor follows the pen
      renderCursor();
      drawStrokes();
    } else if (msg.phase === 'end') {
      if (stroke.length >= 3) strokes.push(stroke);
      stroke = [];
      drawStrokes();
      clearTimeout(strokeIdleTimer);
      strokeIdleTimer = setTimeout(interpretStrokes, STROKE_IDLE_MS);
    }
  }

  function strokeLength(pts) {
    let L = 0;
    for (let i = 1; i < pts.length; i++) L += Math.hypot(pts[i].x - pts[i - 1].x, pts[i].y - pts[i - 1].y);
    return L;
  }
  function inPoly(px, py, pts) {
    let inside = false;
    for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
      const xi = pts[i].x, yi = pts[i].y, xj = pts[j].x, yj = pts[j].y;
      if (((yi > py) !== (yj > py)) && (px < (xj - xi) * (py - yi) / (yj - yi) + xi)) inside = !inside;
    }
    return inside;
  }

  // After a stroke ends we ask the server to interpret it with Claude.
  // If the server has no API key (or errors / times out), we fall back to
  // the local circle rules below.
  let pending = null;      // { closed, hits: [{cmd, label, multi}] }
  let pendingTimer = null;

  function analyzeStroke(pts) {
    const L = strokeLength(pts);
    const gap = Math.hypot(pts[0].x - pts[pts.length - 1].x, pts[0].y - pts[pts.length - 1].y);
    // count x-direction reversals: a circle has ~2 per lap, a scribble many
    let revs = 0, lastSign = 0;
    for (let i = 1; i < pts.length; i++) {
      const dx = pts[i].x - pts[i - 1].x;
      if (Math.abs(dx) < 3) continue;
      const s = Math.sign(dx);
      if (lastSign && s !== lastSign) revs++;
      lastSign = s;
    }
    const isScribble = revs >= 4 && L > 150;
    // small circles count too: threshold low enough for a loop around one word
    const closed = !isScribble && L > 70 && gap < Math.max(35, L * 0.28);
    let shape = 'freeform';
    if (isScribble) {
      shape = 'scribble';
    } else if (closed) {
      shape = 'circle';
    } else {
      const straight = gap / Math.max(L, 1);
      if (straight > 0.82) {
        const ang = Math.abs(Math.atan2(pts[pts.length - 1].y - pts[0].y, pts[pts.length - 1].x - pts[0].x)) * 180 / Math.PI;
        shape = (ang < 28 || ang > 152) ? 'line-horizontal'
          : (ang > 62 && ang < 118) ? 'line-vertical' : 'line-diagonal';
      }
    }
    let minX = W, minY = H, maxX = 0, maxY = 0, sumY = 0;
    for (const p of pts) {
      minX = Math.min(minX, p.x); minY = Math.min(minY, p.y);
      maxX = Math.max(maxX, p.x); maxY = Math.max(maxY, p.y);
      sumY += p.y;
    }
    return { pts, L, closed, shape, minX, minY, maxX, maxY, avgY: sumY / pts.length };
  }

  let drawIntent = 'interact';

  function interpretStrokes() {
    const an = strokes.filter((s) => s.length >= 8).map(analyzeStroke);
    if (!an.length) { clearInk(true); return; }

    // while a proposal is up, a short quick horizontal stroke in draw mode
    // answers it (right = yes, left = no) instead of being interpreted
    if (proposal && an.length === 1 && !an[0].closed &&
        an[0].shape === 'line-horizontal' && an[0].L < 170) {
      const s = an[0].pts;
      clearInk(false);
      doSwipe(s[s.length - 1].x >= s[0].x ? 'right' : 'left');
      return;
    }

    const rect = hud.getBoundingClientRect();
    const minX = Math.min(...an.map((a) => a.minX));
    const minY = Math.min(...an.map((a) => a.minY));
    const maxX = Math.max(...an.map((a) => a.maxX));
    const maxY = Math.max(...an.map((a) => a.maxY));

    // how the drawing (any of its strokes) relates to each element
    const flagsFor = (el) => {
      const r = el.getBoundingClientRect();
      if (!r.width || !r.height) return { circled: false, crossed: false, underlined: false, touched: false };
      const relL = r.left - rect.left, relT = r.top - rect.top;
      const midY = relT + r.height / 2;
      let circled = false, crossed = false, underlined = false, touched = false;
      for (const a of an) {
        const loopCx = (a.minX + a.maxX) / 2, loopCy = (a.minY + a.maxY) / 2;
        if (a.closed && (
          [0.12, 0.3, 0.5, 0.7, 0.88].some((f) => inPoly(relL + r.width * f, midY, a.pts)) ||
          (loopCx >= relL && loopCx <= relL + r.width && loopCy >= relT && loopCy <= relT + r.height))) {
          circled = true;
        }
        const inside = a.pts.reduce((n, p) =>
          n + (p.x >= relL && p.x <= relL + r.width && p.y >= relT && p.y <= relT + r.height ? 1 : 0), 0);
        if (inside >= 3) touched = true;
        // crossed requires the stroke to actually SPAN the element, not just
        // touch it - a small mark on a row is pointing, not striking
        const overlapX = Math.min(a.maxX, relL + r.width) - Math.max(a.minX, relL);
        const overlapY = Math.min(a.maxY, relT + r.height) - Math.max(a.minY, relT);
        if (!a.closed && inside >= Math.min(6, Math.ceil(a.pts.length * 0.2)) &&
            (overlapX >= r.width * 0.5 || overlapY >= r.height * 0.9)) crossed = true;
        if (a.shape === 'line-horizontal' && overlapX > r.width * 0.4 &&
            a.avgY > relT + r.height * 0.55 && a.avgY < relT + r.height + 16) underlined = true;
      }
      if (crossed) underlined = false;
      return { circled, crossed, underlined, touched };
    };
    const elements = [...card.querySelectorAll('[data-action]')].map((el) => ({
      label: el.dataset.action, cmd: el.dataset.cmd,
      multi: el.dataset.multi === '1', ...flagsFor(el),
    }));
    const contents = [...card.querySelectorAll('[data-content]')].map((el) => ({
      id: el.dataset.content,
      text: el.textContent.trim().slice(0, 200),
      ...flagsFor(el),
    }));

    // offline fallback: a circle selects circled things; a strike acts on
    // what it crossed through
    const anyClosed = an.some((a) => a.closed);
    const circledHits = elements.filter((e) => e.circled);
    const crossedHits = elements.filter((e) => e.crossed);
    pending = { closed: anyClosed, hits: circledHits.length ? circledHits : (anyClosed ? [] : crossedHits) };

    if (ws && ws.readyState === WebSocket.OPEN) {
      showBubble('interpreting your drawing…', true);
      clearTimeout(pendingTimer);
      pendingTimer = setTimeout(() => localInterpret(), 12000);
      const payload = {
        screen,
        mode: drawIntent,
        extraCommands: screen === 'quiz' ? [
          { cmd: 'quiz:only:addition', desc: 'restart the quiz with addition questions only' },
          { cmd: 'quiz:only:multiplication', desc: 'restart the quiz with multiplication questions only' },
          { cmd: 'quiz:mixed', desc: 'restart the quiz with mixed topics' },
        ] : [],
        drawing: {
          // several short strokes (or one wide scribble) usually means the
          // user is WRITING, not gesturing
          looksLikeWriting:
            (an.length >= 2 && an.map((a) => a.L).sort((x, y) => x - y)[Math.floor(an.length / 2)] < 200) ||
            (an.length === 1 && an[0].shape === 'scribble' &&
              (an[0].maxX - an[0].minX) > (an[0].maxY - an[0].minY) * 1.5),
          strokes: an.map((a) => ({
            shape: a.shape,
            closed: a.closed,
            points: a.pts.length,
            length: Math.round(a.L),
            bbox: { x: Math.round(a.minX), y: Math.round(a.minY), w: Math.round(a.maxX - a.minX), h: Math.round(a.maxY - a.minY) },
          })),
          bbox: { x: Math.round(minX), y: Math.round(minY), w: Math.round(maxX - minX), h: Math.round(maxY - minY) },
        },
        elements: elements.map(({ label, cmd, circled, crossed, underlined, touched }) => ({ label, cmd, circled, crossed, underlined, touched })),
        contents,
      };
      // screenshot the HUD (strokes included) so the model can see the drawing
      captureHud().then((image) => {
        if (image) payload.image = image;
        clearInk(true);
        if (ws && ws.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify({ type: 'interpret', payload }));
        } else {
          localInterpret();
        }
      });
    } else {
      localInterpret();
      clearInk(true);
    }
  }

  async function captureHud() {
    try {
      if (!window.html2canvas) return null;
      const canvas = await Promise.race([
        // scale 2 so small handwriting stays legible to the model
        html2canvas(hud, { backgroundColor: '#0d1117', logging: false, scale: 2 }),
        new Promise((resolve) => setTimeout(() => resolve(null), 2500)),
      ]);
      return canvas ? canvas.toDataURL('image/jpeg', 0.75) : null;
    } catch {
      return null;
    }
  }

  // An AI proposal awaiting the user's yes/no (flick right / left)
  let proposal = null;
  let proposalTimer = null;

  function applyAssistant(actions, edits) {
    for (const cmd of actions) {
      const el = card.querySelector('[data-cmd="' + cmd + '"]');
      if (el) {
        el.classList.add('circled');
        setTimeout(() => { if (el.isConnected) el.classList.remove('circled'); }, 700);
      }
      run(cmd);
    }
    // corrective edits: rewrite or restyle the targeted part of the display
    // (applied after actions, since actions may re-render the card)
    for (const e of edits) {
      if (!e || typeof e.target !== 'string' || /["\\\]]/.test(e.target)) continue;
      const el = card.querySelector('[data-cmd="' + e.target + '"], [data-content="' + e.target + '"]');
      if (!el) continue;
      if (typeof e.text === 'string' && e.text) el.textContent = e.text;
      if (e.style === 'emphasize') el.classList.add('ai-emphasize');
      else if (e.style === 'dim') el.classList.add('ai-dim');
      else if (e.style === 'strike') el.classList.add('ai-strike');
      if (typeof e.note === 'string' && e.note) {
        // a caption pinned under the target (e.g. an explanation)
        const old = el.nextElementSibling;
        if (old && old.classList.contains('elnote')) old.remove();
        const n = document.createElement('div');
        n.className = 'elnote';
        n.textContent = 'ⓘ ' + e.note;
        el.insertAdjacentElement('afterend', n);
      }
      el.classList.add('circled');
      setTimeout(() => { if (el.isConnected) el.classList.remove('circled'); }, 900);
    }
  }

  // A photo from the phone camera: show it in the translate task and ask
  // the model to read + translate the text in it.
  function doPhoto(msg) {
    if (typeof msg.image !== 'string' || !msg.image.startsWith('data:image/')) return;
    screen = 'translate';
    tr.photoImage = msg.image;
    tr.photoLines = null;
    render();
    if (ws && ws.readyState === WebSocket.OPEN) {
      pending = { photo: true, closed: false, hits: [] };
      clearTimeout(pendingTimer);
      pendingTimer = setTimeout(() => localInterpret(), 25000);
      showBubble('translating your photo…', true);
      ws.send(JSON.stringify({
        type: 'interpret',
        payload: { screen: 'translate', task: 'photo-translate', image: msg.image },
      }));
    } else {
      tr.photoLines = [];
      render();
      showToast('no server connection');
    }
  }

  function onAssistant(msg) {
    if (!pending) return;
    clearTimeout(pendingTimer);
    if (pending.photo) {
      pending = null;
      if (!msg.ai) {
        tr.photoLines = [];
        if (screen === 'translate') render();
        hideBubble();
        showToast('photo translation needs a working AI key');
        return;
      }
      tr.photoLines = Array.isArray(msg.lines) ? msg.lines : [];
      if (screen === 'translate') render();
      showBubble(msg.say || 'translated');
      return;
    }
    if (pending.ideas) {
      pending = null;
      if (!msg.ai || !Array.isArray(msg.ideas) || !msg.ideas.length) {
        hideBubble();
        useStaticIdeas('using built-in ideas (AI unavailable)');
        return;
      }
      id8.ideas = msg.ideas.map((i) => ({
        title: String(i.title || 'Idea'),
        tag: String(i.tag || ''),
        tags: Array.isArray(i.tags) ? i.tags.map(String).slice(0, 3) : [],
        details: Array.isArray(i.details) ? i.details.map(String).slice(0, 4) : [],
      }));
      id8.phase = 'cards';
      id8.pos = 0;
      if (screen === 'ideate') render();
      showBubble(msg.say || 'here are some ideas');
      return;
    }
    if (!msg.ai) { localInterpret(); return; }
    pending = null;
    const actions = Array.isArray(msg.actions) ? msg.actions : [];
    const edits = Array.isArray(msg.edits) ? msg.edits : [];

    if ((actions.length || edits.length) && msg.confidence !== 'high') {
      // the model proposes; the user confirms with a flick
      proposal = { actions, edits };
      clearTimeout(proposalTimer);
      proposalTimer = setTimeout(() => {
        if (proposal) { proposal = null; hideBubble(); showToast('suggestion expired'); }
      }, 15000);
      showBubble(msg.say || 'Should I do that?', false, true);
      return;
    }
    showBubble(msg.say || '…');
    applyAssistant(actions, edits);
  }

  function localInterpret() {
    if (!pending) return;
    if (pending.photo) {
      pending = null;
      hideBubble();
      tr.photoLines = [];
      if (screen === 'translate') render();
      showToast('photo translation needs a working AI key');
      sendAck('photo translation unavailable', false);
      return;
    }
    if (pending.ideas) {
      pending = null;
      hideBubble();
      useStaticIdeas('using built-in ideas (add an AI key for personalized ones)');
      sendAck('built-in ideas', true);
      return;
    }
    const { closed, hits } = pending;
    pending = null;
    hideBubble();
    if (!closed && hits.length === 0) {
      showToast('✎ drawing noted (no gesture match)');
      sendAck('drawing noted', false);
      return;
    }
    const flashEl = (cmd) => {
      const el = card.querySelector('[data-cmd="' + cmd + '"]');
      if (el) {
        el.classList.add('circled');
        setTimeout(() => { if (el.isConnected) el.classList.remove('circled'); }, 700);
      }
    };
    if (hits.length === 0) {
      showToast('circled nothing');
      sendAck('circled nothing', false);
    } else if (hits.length === 1) {
      flashEl(hits[0].cmd);
      if (run(hits[0].cmd)) {
        showToast('○ ' + hits[0].label);
        sendAck('Circled: ' + hits[0].label, true);
      }
    } else {
      const multi = hits.filter((h) => h.multi);
      hits.forEach((h) => flashEl(h.cmd));
      if (multi.length === hits.length) {
        multi.forEach((h) => run(h.cmd));
        showToast('○ ' + multi.length + ' selected');
        sendAck('Circled: ' + multi.map((h) => h.label).join(', '), true);
      } else {
        showToast('circled ' + hits.length + ' things — ambiguous, tap one');
        sendAck('Ambiguous circle: ' + hits.map((h) => h.label).join(', '), false);
      }
    }
  }

  let bubbleTimer = null;
  function showBubble(text, thinking, sticky) {
    bubble.innerHTML = '<span class="who">✨ assistant</span>' +
      String(text).replace(/&/g, '&amp;').replace(/</g, '&lt;') +
      (sticky ? '<br><span style="color:var(--muted);font-size:11px;">flick right = yes · flick left = no</span>' : '');
    bubble.classList.toggle('thinking', !!thinking);
    bubble.classList.add('show');
    clearTimeout(bubbleTimer);
    if (!thinking && !sticky) bubbleTimer = setTimeout(hideBubble, 4500);
  }
  function hideBubble() {
    clearTimeout(bubbleTimer);
    bubble.classList.remove('show', 'thinking');
  }

  function showToast(text) {
    toast.textContent = text;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), 1700);
  }

  render();
  renderCursor();
  connect();
})();
</script>
</body>
</html>
